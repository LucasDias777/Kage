; Relógio do Kage: dia da semana em letras largas, data e horário com o enfeite em volta.
; Skin própria do Kage (fonte Kage Display desenhada para ela). Horário e data em Quicksand (SIL OFL 1.1).

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=Relógio
Author=Kage
Information=Dia da semana, data e horário. Mude o tamanho em Escala, abaixo.
Version=1.0
License=PolyForm Noncommercial 1.0.0

[Variables]
; Tamanho do relógio: 1.30 numa tela de 2560x1440, 1.06 numa de 1920x1080.
; Ao mudar a Escala, mude o EspacoDia junto (12.26 em 1.30, 10 em 1.06).
Escala=1.30
Cor=255,255,255
; Espaço entre as letras do dia, em pontos.
EspacoDia=12.26
Dias="Sunday":"Domingo","Monday":"Segunda","Tuesday":"Terça","Wednesday":"Quarta","Thursday":"Quinta","Friday":"Sexta","Saturday":"Sábado"
Meses="January":"Janeiro","February":"Fevereiro","March":"Março","April":"Abril","May":"Maio","June":"Junho","July":"Julho","August":"Agosto","September":"Setembro","October":"Outubro","November":"Novembro","December":"Dezembro"

; ---------------------------------------------------------------- medidas

[Horario]
Measure=Time
Format="%H:%M"

[DiaDaSemana]
Measure=Time
Format=%A
Substitute=#Dias#

[DataCompleta]
Measure=Time
Format=%d  %B,  %Y.
Substitute=#Meses#

; ---------------------------------------------------------------- desenho

[TextoHorario]
Meter=String
MeasureName=Horario
StringAlign=Center
FontFace=Quicksand
FontColor=#Cor#
FontSize=(14*#Escala#)
X=(340*#Escala#)
Y=(120*#Escala#)
Text="%1"
AntiAlias=1

[Enfeite]
Meter=String
StringAlign=Center
FontFace=Kage Display
FontColor=#Cor#
FontSize=(14*#Escala#)
X=(340*#Escala#)
; O enfeite é o "|" da Kage Display; sobe 5% do corpo para a linha de base casar com a do horário.
Y=((120-14*4/3*0.05)*#Escala#)
Text="|"
AntiAlias=1

[TextoDia]
Meter=String
MeasureName=DiaDaSemana
StringAlign=Center
StringCase=Upper
FontFace=Kage Display
FontColor=#Cor#
FontSize=(40*#Escala#)
X=(340*#Escala#)
Y=0
Text="%1"
InlineSetting=CharacterSpacing | #EspacoDia# | #EspacoDia#
AntiAlias=1
DynamicVariables=1

[TextoData]
Meter=String
MeasureName=DataCompleta
StringAlign=Center
StringCase=Upper
FontFace=Quicksand
FontColor=#Cor#
FontSize=(14*#Escala#)
X=(340*#Escala#)
Y=(75*#Escala#)
Text="%1"
AntiAlias=1
